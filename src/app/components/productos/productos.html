<mat-accordion multi>
    <mat-expansion-panel hideToggle expanded="true">
        <mat-expansion-panel-header>
            <mat-panel-description>
                <button mat-stroked-button *ngIf="!productoSeleccionado || productoSeleccionado.id == 0" color="primary"
                    (click)="crearProducto()">Crear Producto</button>
                <button mat-stroked-button *ngIf="!productoSeleccionado || productoSeleccionado.id > 0" color="primary"
                    (click)="crearProducto()">Editar Producto</button>
            </mat-panel-description>
        </mat-expansion-panel-header>
    </mat-expansion-panel>
    <mat-expansion-panel hideToggle expanded="true" [style.overflow]="'auto'">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Tabla Productos
            </mat-panel-title>
        </mat-expansion-panel-header>

        <table mat-table [dataSource]="productosList()" class="mat-elevation-z8">

            <ng-container matColumnDef="sku">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Codigo</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.sku}}
                </td>
            </ng-container>
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Nombre</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.nombre}}</td>
            </ng-container>
            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Descripcion</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.descripcion}}</td>
            </ng-container>
            <ng-container matColumnDef="precio_venta">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Precio
                    de Venta</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.precio_venta |
                    currency}}
                </td>
            </ng-container>
            <ng-container matColumnDef="estado">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Periodo</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.estado.descripcion}}
                </td>
            </ng-container>

            <!-- Opciones Column -->
            <ng-container matColumnDef="opciones" stickyEnd>
                <th mat-header-cell *matHeaderCellDef aria-label="row actions">OPCIONES</th>
                <td mat-cell *matCellDef="let element">
                    <button matMiniFab (click)="editarProducto(element)">
                        <mat-icon>edit</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row
                *matHeaderRowDef="['sku','nombre', 'descripcion', 'precio_venta', 'estado','opciones']">
            </tr>
            <tr mat-row
                *matRowDef="let row; columns: ['sku','nombre', 'descripcion', 'precio_venta', 'estado','opciones'];"
                (click)="seleccionarProducto(row)"></tr>
        </table>
    </mat-expansion-panel>
</mat-accordion>
