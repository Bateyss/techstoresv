<mat-accordion multi>
    <mat-expansion-panel hideToggle expanded="true" [style.overflow]="'auto'">
        <mat-expansion-panel-header>
            <mat-panel-title>
                Compra de productos
            </mat-panel-title>
        </mat-expansion-panel-header>


        <table mat-table [dataSource]="productosList()" class="mat-elevation-z8">

            <ng-container matColumnDef="sku">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Codigo</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.sku}}
                </td>
            </ng-container>
            <ng-container matColumnDef="nombre">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Nombre</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.nombre}}</td>
            </ng-container>
            <ng-container matColumnDef="descripcion">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Descripcion</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.descripcion}}</td>
            </ng-container>
            <ng-container matColumnDef="stock_web">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Stock Web</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.stock_web}}
                </td>
            </ng-container>
            <ng-container matColumnDef="stock_local">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Stock Local</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.stock_local}}
                </td>
            </ng-container>
            <ng-container matColumnDef="estado">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Periodo</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.estado.descripcion}}
                </td>
            </ng-container>

            <!-- Opciones Column -->
            <ng-container matColumnDef="opciones" stickyEnd>
                <th mat-header-cell *matHeaderCellDef aria-label="row actions">Ver Movimientos</th>
                <td mat-cell *matCellDef="let element">
                    <button aria-label="Ver Movimientos" matMiniFab (click)="verMovimientosProducto(element)">
                        <mat-icon>article</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row
                *matHeaderRowDef="['sku','nombre', 'descripcion', 'stock_web', 'stock_local', 'estado','opciones']">
            </tr>
            <tr mat-row
                *matRowDef="let row; columns: ['sku','nombre', 'descripcion', 'stock_web', 'stock_local', 'estado','opciones'];">
            </tr>
        </table>
    </mat-expansion-panel>
    <mat-expansion-panel hideToggle expanded="true">
        <mat-expansion-panel-header>
            <mat-panel-description>
                <button mat-stroked-button color="primary" (click)="verCompras()">Libro Compras</button>
                <button mat-stroked-button color="primary" (click)="verVentas()">Libro Ventas</button>
                <button mat-stroked-button color="primary" (click)="verMovimientosDiario()">Libro Diario</button>
                <button mat-stroked-button color="primary" (click)="verMovimientosMayor()">Libro Mayor</button>
            </mat-panel-description>
        </mat-expansion-panel-header>
    </mat-expansion-panel>
</mat-accordion>
