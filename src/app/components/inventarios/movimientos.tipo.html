<mat-dialog-content>
    <div>
        <p>Movimientos de {{tipoMovimiento().descripcion}}</p>
        <table mat-table [dataSource]="movimientosList()" class="mat-elevation-z8">

            <ng-container matColumnDef="sku">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Codigo</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.producto.sku}}
                </td>
            </ng-container>
            <ng-container matColumnDef="producto">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Producto</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.producto.nombre}}
                </td>
            </ng-container>
            <ng-container matColumnDef="fecha">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Fecha</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.fecha | date:
                    'dd/MM/yyyy hh:mm:ss a'}}
                </td>
            </ng-container>
            <ng-container matColumnDef="lote">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Lote</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.lote.id}}</td>
            </ng-container>
            <ng-container matColumnDef="tipo_movimiento">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Movimiento</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'">
                    {{element.tipo_movimiento.descripcion}}</td>
            </ng-container>
            <ng-container matColumnDef="cantidad">
                <th mat-header-cell *matHeaderCellDef [style.textAlign]="'center'">Cantidad</th>
                <td mat-cell *matCellDef="let element" [style.textAlign]="'center'"> {{element.cantidad}}
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="['sku', 'producto','fecha', 'lote', 'tipo_movimiento', 'cantidad']">
            </tr>
            <tr mat-row
                *matRowDef="let row; columns: ['sku', 'producto','fecha', 'lote', 'tipo_movimiento', 'cantidad'];">
            </tr>
        </table>
    </div>
    <div>
        <button mat-stroked-button color="primary" (click)="cerrarDetalles()">Cerrar</button>
    </div>
</mat-dialog-content>
